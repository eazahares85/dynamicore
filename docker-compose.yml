services:
  postgres:
    image: postgres:16-alpine
    container_name: dynamicore-db
    environment:
      POSTGRES_USER: dynamicore
      POSTGRES_PASSWORD: dynamicore
      POSTGRES_DB: dynamicore_payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamicore -d dynamicore_payments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
